<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="edit.metaTitle">AWGP Books — Edit OCR</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1d1d1f;
      --muted: #6e6e73;
      --bg: #f5f5f7;
      --card: #fff;
      --accent: #ff6b35;
      --ok: #248a3d;
      --border: rgba(128,128,128,.35);
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #0d0d0f; --card: #1c1c1e; --border: rgba(128,128,128,.4); }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", "Noto Sans Gujarati", sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.45;
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      padding: 10px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .bar a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .bar h1 { font-size: 1rem; margin: 0; flex: 1 1 180px; }
    .lang-switcher { display: flex; gap: 6px; }
    .lang-btn {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
    }
    .lang-btn.is-active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      display: inline-block;
      font-weight: 600;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
    }
    .status-line { font-size: 12px; color: var(--muted); }
    .status-line.ok { color: var(--ok); }
    .status-line.error { color: #c0392b; }
    .submit-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .submit-row input[type="text"] {
      min-width: 140px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
    }
    .stage { padding: 16px; max-width: 1100px; margin: 0 auto; }
    .progress-wrap {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(0,0,0,.06);
    }
    .progress-bar {
      height: 8px;
      background: rgba(128,128,128,.2);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }
    .progress-bar > span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
    }
    .workspace {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      height: calc(100vh - 88px);
      padding: 12px;
    }
    .workspace.is-open { display: grid; }
    .pane {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
      box-shadow: 0 2px 16px rgba(0,0,0,.06);
    }
    .pane-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    .page-img-wrap {
      flex: 1;
      overflow: auto;
      background: #111;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .page-img-wrap img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .no-image {
      color: #aaa;
      padding: 24px;
      text-align: center;
    }
    textarea {
      flex: 1;
      width: 100%;
      border: none;
      resize: none;
      padding: 14px;
      font-size: 16px;
      line-height: 1.6;
      background: var(--card);
      color: var(--fg);
      font-family: "Noto Sans Devanagari", "Noto Sans Gujarati", ui-sans-serif, sans-serif;
    }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
    .error { color: #c0392b; }
    @media (max-width: 800px) {
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
      }
      .page-img-wrap { max-height: 42vh; }
      textarea { min-height: 40vh; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a id="back-link" href="../index.html" data-i18n="edit.back">← All books</a>
    <h1 id="book-title" data-i18n="edit.loadingTitle">Loading…</h1>
    <div id="lang-switcher" class="lang-switcher" role="group" aria-label="Language"></div>
    <div class="nav">
      <button type="button" class="btn btn-secondary" id="prev-btn" data-i18n="edit.prev">Previous</button>
      <span id="page-label" class="status-line"></span>
      <button type="button" class="btn btn-secondary" id="next-btn" data-i18n="edit.next">Next</button>
    </div>
    <div class="submit-row">
      <input id="volunteer-name" type="text" maxlength="120" autocomplete="name" data-i18n-placeholder="table.yourName" placeholder="Your name" />
      <button type="button" class="btn" id="submit-btn" data-i18n="edit.submit">Submit corrected</button>
    </div>
    <span id="save-status" class="status-line"></span>
  </div>

  <div id="stage" class="stage">
    <div class="progress-wrap">
      <p id="load-msg" class="lead" data-i18n="edit.loadingPackage">Loading the book package…</p>
      <div class="progress-bar" aria-hidden="true"><span id="progress-fill"></span></div>
    </div>
  </div>

  <div id="workspace" class="workspace">
    <section class="pane">
      <div class="pane-label" data-i18n="edit.scanLabel">Scan</div>
      <div class="page-img-wrap">
        <img id="page-img" alt="" hidden />
        <p id="no-image" class="no-image" hidden data-i18n="edit.noImage">No page image for this page.</p>
      </div>
    </section>
    <section class="pane">
      <div class="pane-label" data-i18n="edit.textLabel">Text (keep page markers when submitting)</div>
      <textarea id="page-text" spellcheck="false"></textarea>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="locales/en.js"></script>
  <script src="locales/hi.js"></script>
  <script src="locales/gu.js"></script>
  <script src="locales/mr.js"></script>
  <script src="i18n.js"></script>
  <script src="ocr-editor.js"></script>
</body>
</html>
