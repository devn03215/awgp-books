name: Update live website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: railway-website-refresh
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.45.7
      - name: Refresh all repository content
        run: |
          railway variable set "AWGP_CONTENT_REVISION=${GITHUB_REPOSITORY}@${GITHUB_SHA}" --project 4f942fdd-9988-4b08-9a5b-73803bff65b2 --service 447237fb-b6ca-41d2-b062-69d9940b7316 --environment aa686994-9793-4a5a-b5bf-b9e75bba9620 --skip-deploys
          railway redeploy --yes --project 4f942fdd-9988-4b08-9a5b-73803bff65b2 --service 447237fb-b6ca-41d2-b062-69d9940b7316 --environment aa686994-9793-4a5a-b5bf-b9e75bba9620
        env:
          RAILWAY_TOKEN: ${{ secrets.AWGP_WEBSITE_RAILWAY_TOKEN }}
      - name: Verify this commit on both domains
        run: node .hosting/verify-deployment.mjs
